name: Sitio (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preparar el sitio (landing en la raíz + panel en modo demo en /panel/ + imagen OG + favicon)
        run: |
          mkdir -p _site/panel _site/assets
          cp landing/index.html _site/index.html
          cp src/panel/index.html _site/panel/index.html
          cp assets/og-image.png _site/og-image.png
          cp assets/og-image.svg _site/og-image.svg
          cp assets/favicon.png _site/assets/favicon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
